    <button onclick="topFunction()" id="movetop" title="Go to top">

    <script>
        // When the user scrolls down 20px from the top of the document, show the button
        /**<i style="border: 2px solid red;height: 6rem;width: 6rem;object-fit: cover;"><img src="./assets/images/www.png" alt="" style="width: 100%;height:100%;"></i>
                    Eyish Foundation**/
        window.onscroll = function () {
            scrollFunction()
        };

        function scrollFunction() {
            if (document.body.scrollTop > 20 || document.documentElement.scrollTop > 20) {
                document.getElementById("movetop").style.display = "block";
            } else {
                document.getElementById("movetop").style.display = "none";
            }
        }

        // When the user clicks on the button, scroll to the top of the document
        function topFunction() {
            document.body.scrollTop = 0;
            document.documentElement.scrollTop = 0;
        }
    </script>

    <script>
        const postBtn = document.getElementById('post-btn');

            formData.append("file", uploadFile.files[0]);
            console.log(formData);
            axios
                .post(
                    'http://localhost:8000/predict_disease',
                    formData,
                    {
                        // headers: {
                        //   'Content-Type': 'application/json'
                        // }
                    }
                )
                .then(response => {
                    console.log(response.data);
                    document.getElementById("disease").innerText = response.data.class;
                    document.getElementById("confidence").innerText = response.data.confidence;
                    console.log("response", response.data.class);
                })
                .catch(err => {
                    console.log(err, err.response);
                });
        };
        postBtn.addEventListener('click', sendData);
    </script>

    <script>

            } else {

            }
        });

        $(".navbar-toggler").on("click", function () {
            $("header").toggleClass("active");
        });
        $(document).on("ready", function () {
            if ($(window).width() > 991) {
                $("header").removeClass("active");
            }
            $(window).on("resize", function () {
                if ($(window).width() > 991) {
                    $("header").removeClass("active");
                }
            });
        });
    </script>

    <script>
        function dragNdrop(event) {
            var filename = URL.createObjectURL(event.target.files[0]); //will store file name with src
            var preview = document.getElementById('preview'); //the div where we will show image
            var previewImg = document.createElement("img"); //creating new image tag
            previewImg.setAttribute("src", filename); //setting attribute src of newly created "img" element to "filename"
            previewImg.style.height = '100%';
            previewImg.style.width = '100%';
            preview.innerHTML = "";
            preview.appendChild(previewImg); //finally append "img" element to parent element "preview"
        }

        //2. drag

        function drag() {
            //while dragging it will fire this function that will add the following class
            document.getElementById('uploadFile').parentNode.className = "draging dragBox";
        }

        //3. finally the drop()
        function drop() {
            document.getElementById('uploadFile').parentNode.className = 'dragBox';
        }
    </script>
    <script>
        function dragNdrops(event) {
            var filename = URL.createObjectURL(event.target.files[0]); //will store file name with src
            var previews = document.getElementById('previews'); //the div where we will show image
            var previewImgs = document.createElement("img"); //creating new image tag
            previewImgs.setAttribute("src", filename); //setting attribute src of newly created "img" element to "filename"
            previewImgs.style.height = '100%';
            previewImgs.style.width = '100%';
            previews.innerHTML = "";
            previews.appendChild(previewImgs); //finally append "img" element to parent element "preview"
        }

        //2. drag

        function drags() {
            //while dragging it will fire this function that will add the following class
            document.getElementById('uploadFiles').parentNode.className = "draging dragBox";
        }

        //3. finally the drop()
        function drops() {
            document.getElementById('uploadFiles').parentNode.className = 'dragBox';
        }
    </script>
